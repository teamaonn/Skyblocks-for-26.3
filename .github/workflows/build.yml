name: Build Sky Islands

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Install test runtime dependency
        run: |
          mkdir -p build/run/gameTest/mods
          curl --fail --location --retry 3 https://cdn.modrinth.com/data/cl223EMc/versions/rWxmPrGC/cristellib-fabric-26.3-3.1.13.jar -o build/run/gameTest/mods/cristellib.jar
      - name: Build and test repair in Minecraft
        run: gradle build runGameTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: skyblocks-jar
          path: build/libs/*.jar
